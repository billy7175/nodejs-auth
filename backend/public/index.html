<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js Auth 테스트 페이지</title>
    <script>
        // 헤더에서 즉시 실행
        alert('HTML이 로드되었습니다!');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .result.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }
        .result.error {
            background: #ffebee;
            border-left-color: #f44336;
        }
        .result pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 12px;
        }
        .token-display {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            font-size: 12px;
            word-break: break-all;
        }
        .links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .links a {
            display: inline-block;
            margin-right: 15px;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .user-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-info h3 {
            margin-bottom: 10px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Node.js Auth 테스트</h1>
        <p class="subtitle">백엔드 API를 테스트할 수 있는 간단한 프론트엔드 페이지</p>

        <div id="userInfo" class="user-info" style="display: none;">
            <h3>로그인 정보</h3>
            <div id="userDetails"></div>
            <button onclick="logout()" style="margin-top: 10px; width: auto; padding: 8px 16px;">로그아웃</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('register', this)">회원가입</button>
            <button class="tab" onclick="showTab('login', this)">로그인</button>
            <button class="tab" onclick="showTab('profile', this)">내 정보</button>
            <button class="tab" onclick="showTab('2fa', this)">2FA 설정</button>
        </div>

        <!-- 회원가입 -->
        <div id="register" class="tab-content active">
            <h2>회원가입</h2>
            <form onsubmit="register(event)">
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>비밀번호 (최소 8자)</label>
                    <input type="password" id="registerPassword" required minlength="8">
                </div>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="registerName" required>
                </div>
                <button type="submit">회원가입</button>
            </form>
            <div id="registerResult"></div>
        </div>

        <!-- 로그인 -->
        <div id="login" class="tab-content">
            <h2>로그인</h2>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">로그인</button>
            </form>
            <div id="loginResult"></div>
        </div>

        <!-- 내 정보 -->
        <div id="profile" class="tab-content">
            <h2>내 정보</h2>
            <button onclick="getProfile()">정보 조회</button>
            <button onclick="updateProfile()" style="margin-top: 10px;">정보 수정</button>
            <div id="profileResult"></div>
        </div>

        <!-- 2FA 설정 -->
        <div id="2fa" class="tab-content">
            <h2>2FA 설정</h2>
            <p style="color: #666; margin-bottom: 20px;">2FA 기능이 구현되면 여기서 테스트할 수 있습니다.</p>
            <button onclick="setup2FA()">2FA 설정 시작</button>
            <div id="2faResult"></div>
        </div>

        <div class="links">
            <a href="/api-docs" target="_blank">📚 Swagger API 문서</a>
            <a href="/health" target="_blank">💚 헬스 체크</a>
        </div>
    </div>

    <script>
        // 즉시 실행 확인
        alert('스크립트가 로드되었습니다!');
        console.log('스크립트 실행 시작');
        
        const API_BASE = window.location.origin;
        let accessToken = localStorage.getItem('accessToken');
        let refreshToken = localStorage.getItem('refreshToken');

        // 탭 전환 (전역 함수로 명시적 선언)
        window.showTab = function(tabName, element) {
            // 모든 탭 비활성화
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // 선택된 탭 활성화
            if (element) element.classList.add('active');
            const content = document.getElementById(tabName);
            if (content) content.classList.add('active');
        }

        // API 호출 헬퍼
        async function apiCall(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };

            if (accessToken) {
                headers['Authorization'] = `Bearer ${accessToken}`;
            }

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers
                });

                const data = await response.json();
                return { ok: response.ok, status: response.status, data };
            } catch (error) {
                return { ok: false, error: error.message };
            }
        }

        // 결과 표시
        function showResult(elementId, result, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
            element.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }

        // 회원가입
        async function register(event) {
            event.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const name = document.getElementById('registerName').value;

            const result = await apiCall('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({ email, password, name })
            });

            if (result.ok && result.data.success) {
                showResult('registerResult', result.data, true);
                if (result.data.data.accessToken) {
                    accessToken = result.data.data.accessToken;
                    refreshToken = result.data.data.refreshToken;
                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('refreshToken', refreshToken);
                    updateUserInfo(result.data.data.user);
                }
            } else {
                showResult('registerResult', result.data || result, false);
            }
        }

        // 로그인
        async function login(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const result = await apiCall('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            if (result.ok && result.data.success) {
                showResult('loginResult', result.data, true);
                accessToken = result.data.data.accessToken;
                refreshToken = result.data.data.refreshToken;
                localStorage.setItem('accessToken', accessToken);
                localStorage.setItem('refreshToken', refreshToken);
                updateUserInfo(result.data.data.user);
            } else {
                showResult('loginResult', result.data || result, false);
            }
        }

        // 내 정보 조회
        async function getProfile() {
            if (!accessToken) {
                showResult('profileResult', { error: '로그인이 필요합니다.' }, false);
                return;
            }

            const result = await apiCall('/api/auth/me');

            if (result.ok && result.data.success) {
                showResult('profileResult', result.data, true);
                updateUserInfo(result.data.data.user);
            } else {
                showResult('profileResult', result.data || result, false);
                if (result.status === 401) {
                    // 토큰 만료 시 로그아웃
                    logout();
                }
            }
        }

        // 내 정보 수정
        async function updateProfile() {
            if (!accessToken) {
                showResult('profileResult', { error: '로그인이 필요합니다.' }, false);
                return;
            }

            const name = prompt('새 이름을 입력하세요:');
            if (!name) return;

            const result = await apiCall('/api/auth/me', {
                method: 'PUT',
                body: JSON.stringify({ name })
            });

            if (result.ok && result.data.success) {
                showResult('profileResult', result.data, true);
                updateUserInfo(result.data.data.user);
            } else {
                showResult('profileResult', result.data || result, false);
            }
        }

        // 2FA 설정
        async function setup2FA() {
            if (!accessToken) {
                showResult('2faResult', { error: '로그인이 필요합니다.' }, false);
                return;
            }

            const result = await apiCall('/api/auth/2fa/setup', {
                method: 'POST'
            });

            if (result.ok && result.data.success) {
                // QR 코드 표시를 위해 2fa-setup.html로 이동
                window.location.href = '/2fa-setup.html';
            } else {
                showResult('2faResult', result.data || result, false);
            }
        }

        // 로그아웃
        async function logout() {
            if (accessToken) {
                await apiCall('/api/auth/logout', { method: 'POST' });
            }
            accessToken = null;
            refreshToken = null;
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            document.getElementById('userInfo').style.display = 'none';
            showResult('loginResult', { message: '로그아웃되었습니다.' }, true);
        }

        // 사용자 정보 업데이트
        function updateUserInfo(user) {
            const userInfo = document.getElementById('userInfo');
            const userDetails = document.getElementById('userDetails');
            
            if (user) {
                userInfo.style.display = 'block';
                userDetails.innerHTML = `
                    <p><strong>이메일:</strong> ${user.email}</p>
                    <p><strong>이름:</strong> ${user.name || 'N/A'}</p>
                    <p><strong>가입일:</strong> ${new Date(user.createdAt).toLocaleString('ko-KR')}</p>
                `;
            }
        }

        // 페이지 로드 시 사용자 정보 확인
        window.addEventListener('load', () => {
            if (accessToken) {
                getProfile();
            }
        });
    </script>
</body>
</html>
